<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FutureProofed</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C0D11">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { --blue:#0050FD; --black:#0C0D11; --white:#FFFFFF; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--black); color:var(--white);
    font-family:"Helvetica Neue", Helvetica, Arial, Inter, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    padding:7vh 7vw; box-sizing:border-box;
  }
  .lockup { display:flex; align-items:center; gap:14px; }
  .lockup svg { height:26px; width:auto; display:block; }
  .wordmark { font-size:22px; font-weight:500; letter-spacing:-0.01em; line-height:1; }
  main { flex:1; display:flex; align-items:center; }
  h1 {
    margin:0; font-weight:500; letter-spacing:-0.03em; line-height:1;
    font-size:clamp(44px, 9vw, 140px);
  }
</style>
</head>
<body>
  <header class="lockup" aria-label="FutureProofed">
    <svg viewBox="0 0 460 778" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="skewY(19)" fill="#0050FD">
        <rect x="0" y="0" width="460" height="186"/>
        <rect x="0" y="242" width="250" height="176"/>
        <rect x="0" y="473" width="155" height="154"/>
      </g>
    </svg>
    <span class="wordmark">FutureProofed</span>
  </header>
  <main><h1>Coming soon.</h1></main>
</body>
</html>
